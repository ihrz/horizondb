site_name: HorizonDB
site_description: JSON key-value server over WebSocket. Memory above, PostgreSQL below.
site_author: iHorizon
site_url: https://ihrz.gitlab.io/db/docs/
copyright: HorizonDB is part of the iHorizon project.

repo_url: https://gitlab.com/ihrz/db
repo_name: ihrz/db
edit_uri: -/edit/main/docs/en/

docs_dir: en
site_dir: ../public/docs

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Fira Sans
    code: Fira Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
  icon:
    repo: fontawesome/brands/gitlab
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/brand.css

extra:
  alternate:
    - name: English
      link: /db/docs/
      lang: en
    - name: Français
      link: /db/docs/fr/
      lang: fr
  social:
    - icon: material/weather-sunset
      link: https://ihrz.gitlab.io/db/
      name: HorizonDB landing page
    - icon: material/palette-outline
      link: https://ihrz.gitlab.io/db/brand/
      name: Brand kit
    - icon: material/chart-line
      link: https://ihrz.gitlab.io/db/benchmarks/
      name: Benchmark results
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/ihrz/db
      name: Source code on GitLab

plugins:
  - search:
      lang: en

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Configuration: configuration.md
      - Architecture: architecture.md
      - Operations: operations.md
  - Reference:
      - Protocol: protocol.md
      - TypeScript SDK: sdk.md
  - Benchmarks: benchmarks.md
  - FAQ: faq.md
