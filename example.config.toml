[server]
host = "0.0.0.0"
port = 8080
max_connections = 1000
# Largest WebSocket message (request or frame) accepted from a client, in bytes.
# A message above this limit closes that client's connection together with
# every request it has in flight, so size it for your largest document.
# 1 KiB .. 256 MiB, default 64 MiB.
max_message_size = 67108864

[database]
host = "127.0.0.1"
port = 5432
database = "horizon"
username = "horizon"
password = "change-me"
# PostgreSQL pool. Reads of keys not yet in memory (cold start) and the
# periodic flush use it; size it for the number of clients (default 32).
max_connections = 32
min_connections = 0
acquire_timeout_secs = 5
idle_timeout_secs = 30
max_lifetime_secs = 1800
# How often buffered writes are batch-flushed to PostgreSQL (seconds).
flush_interval_secs = 300
# A document already flushed to PostgreSQL and neither read nor written for
# this long leaves memory; its next access reloads it (one SELECT). Keeps the
# RAM bounded by the working set instead of everything read since startup.
# 0 keeps every loaded document in memory forever. Default 900.
idle_eviction_secs = 900

[auth]
username = "admin"
# Exactly one of the two fields is required:
#   - password      : plaintext secret (constant-time comparison)
#   - password_hash : argon2id PHC hash (recommended in production)
password = "secret"
# password_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."
session_timeout_secs = 3600
